<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- brand gradient ground -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B5BFD"/>
      <stop offset="1" stop-color="#9B6BFF"/>
    </linearGradient>
    <!-- soft top-left light -->
    <radialGradient id="glow" cx="0.26" cy="0.18" r="0.78">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- symmetric bottom shade (was bottom-right; no longer sits only behind the I) -->
    <radialGradient id="vig" cx="0.5" cy="1.02" r="0.95">
      <stop offset="0" stop-color="#0B0E17" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0B0E17" stop-opacity="0"/>
    </radialGradient>
    <!-- knob in brand dark -->
    <radialGradient id="knob" cx="0.34" cy="0.28" r="0.85">
      <stop offset="0" stop-color="#3A4468"/>
      <stop offset="0.6" stop-color="#161B2E"/>
      <stop offset="1" stop-color="#0B0E17"/>
    </radialGradient>
    <filter id="sh" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#0B0E17" flood-opacity="0.30"/>
    </filter>
    <filter id="ksh" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0B0E17" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- opaque full-bleed ground (OS applies the corner mask) -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <rect width="1024" height="1024" fill="url(#vig)"/>

  <!-- "U": one 160px round-capped stroke.  "I": 160px pill = the track of a control.
       Both span y=184..840; group spans x=160..864 (centred on 512). Solid off-white, no gradient. -->
  <g filter="url(#sh)">
    <path d="M240 264 V616 A144 144 0 0 0 528 616 V264" fill="none" stroke="#F6F7FB" stroke-width="160" stroke-linecap="round"/>
    <rect x="704" y="184" width="160" height="656" rx="80" fill="#F6F7FB"/>
  </g>

  <!-- track channel (light brand tint) inside the I; knob at the top = switched on / at max -->
  <rect x="744" y="224" width="80" height="576" rx="40" fill="#DDE4FB"/>
  <circle cx="784" cy="264" r="58" fill="url(#knob)" filter="url(#ksh)"/>
</svg>
