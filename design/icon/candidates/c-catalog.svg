<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B5BFD"/>
      <stop offset="1" stop-color="#9B6BFF"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3B5BFD" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#3B5BFD" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9B6BFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9B6BFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-25%" y="-25%" width="150%" height="170%">
      <feDropShadow dx="0" dy="26" stdDeviation="26" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="knobShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1B1F6B" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- background: opaque dark ground + brand glow -->
  <rect width="1024" height="1024" fill="#0B0E17"/>
  <circle cx="280" cy="240" r="660" fill="url(#glowA)"/>
  <circle cx="800" cy="840" r="660" fill="url(#glowB)"/>

  <g transform="translate(512 512) scale(1.08) translate(-512 -512)">
    <!-- back card: chips -->
    <g transform="rotate(-5 512 382)"><rect x="222" y="162" width="580" height="440" rx="52" fill="#CFD3E0" filter="url(#cardShadow)"/>
    <rect x="307" y="200" width="190" height="84" rx="42" fill="url(#brand)"/>
    <rect x="362" y="232" width="80" height="20" rx="10" fill="#FFFFFF"/>
    <rect x="527" y="200" width="190" height="84" rx="42" fill="#FFFFFF"/>
    <rect x="582" y="232" width="80" height="20" rx="10" fill="#A6ABC2"/></g>

    <!-- middle card: button -->
    <g transform="rotate(-2.5 512 542)"><rect x="202" y="322" width="620" height="440" rx="56" fill="#E4E6EF" filter="url(#cardShadow)"/>
    <rect x="362" y="350" width="300" height="104" rx="32" fill="url(#brand)"/>
    <rect x="447" y="391" width="130" height="22" rx="11" fill="#FFFFFF"/></g>

    <!-- front card: toggle (on) -->
    <rect x="182" y="482" width="660" height="380" rx="60" fill="#F6F7FB" filter="url(#cardShadow)"/>
    <rect x="352" y="592" width="320" height="160" rx="80" fill="url(#brand)"/>
    <circle cx="592" cy="672" r="62" fill="#FFFFFF" filter="url(#knobShadow)"/>
  </g>
</svg>
