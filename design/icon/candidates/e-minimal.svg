<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="0.42" cy="0.40" r="0.80">
      <stop offset="0" stop-color="#171D33"/>
      <stop offset="1" stop-color="#0B0E17"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B5BFD"/>
      <stop offset="1" stop-color="#9B6BFF"/>
    </linearGradient>
    <linearGradient id="knob" x1="0.2" y1="0.1" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9ECF7"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="48"/>
    </filter>
  </defs>

  <!-- opaque ground -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- faint glow so the card lifts off the dark ground -->
  <rect x="168" y="168" width="560" height="560" rx="132" fill="url(#card)" opacity="0.42" filter="url(#glow)"/>

  <!-- card -->
  <rect x="168" y="168" width="560" height="560" rx="132" fill="url(#card)"/>

  <!-- shadow cast by the floating knob (only visible where it lands on the card) -->
  <circle cx="724" cy="738" r="164" fill="#0F0C2E" opacity="0.62" filter="url(#soft)"/>

  <!-- floating knob / FAB -->
  <circle cx="700" cy="700" r="160" fill="url(#knob)"/>
</svg>
