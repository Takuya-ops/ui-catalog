<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B5BFD"/>
      <stop offset="1" stop-color="#9B6BFF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.2" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="0.85" cy="0.92" r="0.9">
      <stop offset="0" stop-color="#0B0E17" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0B0E17" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EDF0FA"/>
    </linearGradient>
    <radialGradient id="knob" cx="0.34" cy="0.28" r="0.85">
      <stop offset="0" stop-color="#3A4468"/>
      <stop offset="0.6" stop-color="#161B2E"/>
      <stop offset="1" stop-color="#0B0E17"/>
    </radialGradient>
    <filter id="sh" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#0B0E17" flood-opacity="0.30"/>
    </filter>
    <filter id="ksh" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0B0E17" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- opaque brand-gradient ground (full bleed; OS applies the corner mask) -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <rect width="1024" height="1024" fill="url(#vig)"/>

  <!-- "U" : single 168px rounded stroke -->
  <!-- "I" : 168px pill = vertical toggle track -->
  <g filter="url(#sh)">
    <path d="M224 276 V596 A152 152 0 0 0 528 596 V276" fill="none" stroke="url(#ink)" stroke-width="168" stroke-linecap="round"/>
    <rect x="716" y="192" width="168" height="640" rx="84" fill="url(#ink)"/>
  </g>

  <!-- toggle knob, switched "on" (up), in brand dark -->
  <circle cx="800" cy="276" r="66" fill="url(#knob)" filter="url(#ksh)"/>
</svg>
