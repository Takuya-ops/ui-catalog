<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="512" cy="470" r="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1B2244"/>
      <stop offset="1" stop-color="#0B0E17"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5A6BFF" stop-opacity="0.42"/>
      <stop offset="0.5" stop-color="#6B5BFF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#9B6BFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="track" x1="112" y1="512" x2="912" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3B5BFD"/>
      <stop offset="1" stop-color="#9B6BFF"/>
    </linearGradient>
    <linearGradient id="trackShine" x1="512" y1="282" x2="512" y2="742" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.14"/>
    </linearGradient>
    <linearGradient id="knob" x1="682" y1="322" x2="682" y2="702" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E8EAF4"/>
    </linearGradient>
    <filter id="knobShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0B0E17" flood-opacity="0.5"/>
    </filter>
    <filter id="trackGlow" x="-30%" y="-60%" width="160%" height="220%">
      <feDropShadow dx="0" dy="22" stdDeviation="38" flood-color="#3B5BFD" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- 背景（不透明・全面） -->
  <rect width="1024" height="1024" fill="#0B0E17"/>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <ellipse cx="512" cy="530" rx="560" ry="400" fill="url(#glow)"/>

  <!-- トラック（ON 状態のグラデーション） -->
  <rect x="112" y="282" width="800" height="460" rx="230" fill="url(#track)" filter="url(#trackGlow)"/>
  <rect x="112" y="282" width="800" height="460" rx="230" fill="url(#trackShine)"/>

  <!-- 直前の位置に残る、つまみの残像（動く/触れる、のヒント） -->
  <circle cx="342" cy="512" r="190" fill="#FFFFFF" fill-opacity="0.08"/>

  <!-- つまみ -->
  <circle cx="682" cy="512" r="190" fill="url(#knob)" filter="url(#knobShadow)"/>

  <!-- つまみ内のチェック（唯一のアクセント） -->
  <path d="M 598 523 L 657 584 L 771 451" fill="none" stroke="#3B5BFD" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
