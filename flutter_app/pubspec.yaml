name: ui_catalog
description: "UI Catalog — Web/スマホアプリのUIコンポーネントを、動くデモ・使いどころ・実アプリの採用例つきで学ぶアプリ（Flutter版）"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    # 単一ソース data/components.json を scripts/build-data.mjs がここへコピーする
    - assets/components.json
